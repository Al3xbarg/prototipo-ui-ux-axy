# Identificación del proyecto en SonarQube
sonar.projectKey=prototipo-ui-ux-axy
sonar.projectName=Prototipo UI-UX AXY

# Código fuente (este proyecto es Next.js: NO tiene carpeta src)
sonar.sources=app,components,lib

# Carpetas/archivos que SonarQube debe ignorar
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**

# Pruebas (Vitest usa .test.ts, no .test.js/.test.jsx)
sonar.tests=lib
sonar.test.inclusions=**/*.test.ts

# Reporte de cobertura que genera Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
